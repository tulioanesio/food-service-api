global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'food-service-api'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          env: 'local'

