name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_sonar_scan:
        description: Enable SonarQube scan
        required: false
        type: boolean
        default: false
      enable_deploy_option:
        description: Enable deploy to Render
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 10.30.0

jobs:
  quality:
    name: Quality and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:orders_test@localhost:5432/orders_test
      TEST_DATABASE_URL: postgresql://postgres:orders_test@localhost:5432/orders_test
      JWT_SECRET: ci-only-secret-at-least-32-characters
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: orders_test
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply test database migrations
        run: pnpm exec prisma migrate deploy

      - name: Run HTTP and PostgreSQL integration tests
        run: pnpm run test:e2e --runInBand

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint:check

      - name: Run tests with coverage
        run: pnpm exec jest --coverage --runInBand

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Build application
        run: pnpm build

      - name: Validate Docker image
        run: docker build --tag food-service-api:${{ github.sha }} .

  sonar:
    name: SonarQube Scan and Quality Gate
    needs: quality
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.enable_sonar_scan == true ||
        github.event.inputs.enable_sonar_scan == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.exclusions=src/generated/**,dist/**,coverage/**,src/**/*.spec.ts
            -Dsonar.coverage.exclusions=src/generated/**,src/main.ts,src/config/**,src/swagger/**,src/**/*.module.ts,src/**/*.dto.ts,src/**/*.decorator.ts,src/health/**,src/prisma/prisma.service.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Check SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube summary
        if: success()
        run: echo '### SonarQube Quality Gate passed' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish Docker Image
    needs: [quality, sonar]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.enable_deploy_option == true ||
            github.event.inputs.enable_deploy_option == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to Render
    needs: publish
    if: |
      always() &&
      needs.publish.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.enable_deploy_option == true ||
            github.event.inputs.enable_deploy_option == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Start and wait for Render deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail

          echo "🚀 Acionando a API do Render para o serviço ${RENDER_SERVICE_ID}..."

          if ! CREATE_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json"); then
            echo "❌ Erro ao acionar deploy: Render rejeitou a requisição."
            exit 1
          fi

          DEPLOY_ID=$(echo "${CREATE_RESPONSE}" | jq -r '.id // empty')

          if [ -z "${DEPLOY_ID}" ]; then
            echo "❌ Erro ao acionar deploy. Resposta: ${CREATE_RESPONSE}"
            exit 1
          fi

          echo "RENDER_DEPLOY_ID=${DEPLOY_ID}" >> "${GITHUB_ENV}"
          echo "✅ Deploy acionado (ID: ${DEPLOY_ID}). Aguardando finalização do servidor do Render..."

          # Loop robusto limitando a 40 tentativas (aprox 10 minutos)
          for attempt in $(seq 1 40); do
            STATUS_RESPONSE=$(curl --fail-with-body --silent --show-error \
              --request GET "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json")
            STATUS=$(echo "${STATUS_RESPONSE}" | jq -r '.status // empty')

            echo "Status atual no Render (${attempt}/40): ${STATUS}"

            case "${STATUS}" in
              live)
                echo "RENDER_DEPLOY_STATUS=live" >> "${GITHUB_ENV}"
                echo "🎉 Deploy online com sucesso!"
                exit 0
                ;;
              created|queued|build_in_progress|update_in_progress|deploy_in_progress)
                sleep 15
                ;;
              build_failed|update_failed|deactivated|canceled|cancelled|failed)
                echo "RENDER_DEPLOY_STATUS=${STATUS}" >> "${GITHUB_ENV}"
                echo "❌ O deploy falhou no Render com o status: ${STATUS}"
                exit 1
                ;;
              *)
                echo "❌ Status desconhecido retornado pelo Render: ${STATUS}"
                exit 1
                ;;
            esac
          done

          echo "❌ O deploy atingiu o tempo limite de 10 minutos."
          echo "RENDER_DEPLOY_STATUS=timeout" >> "${GITHUB_ENV}"
          exit 1

      - name: Deploy Summary (Success)
        if: success()
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          echo "### ✅ Deploy Concluído com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "O Render compilou e subiu a aplicação sem erros." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 Acessar o Ambiente:** [${RENDER_SERVICE_URL}](${RENDER_SERVICE_URL})" >> $GITHUB_STEP_SUMMARY

      - name: Deploy Summary (Failure)
        if: failure()
        run: |
          echo "### ❌ Falha no Deploy!" >> $GITHUB_STEP_SUMMARY
          echo "O Render tentou compilar a aplicação, mas ocorreu um erro no servidor." >> $GITHUB_STEP_SUMMARY
          echo "Acesse o painel do Render para ver os logs e entender o que quebrou o Build." >> $GITHUB_STEP_SUMMARY
